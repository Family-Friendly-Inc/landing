name: Deploy to Cloudflare

# Manual only until the hosting cutover. Deploys the Worker and its static assets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Allowlist: same as pages.yml, plus _headers. Add new top-level site dirs here too.
      - run: mkdir _site && cp -r CNAME index.html 404.html robots.txt sitemap.xml styles.css _headers assets about games legal open-source plotlens .well-known _site/
      - run: npx --yes wrangler@4.148.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
